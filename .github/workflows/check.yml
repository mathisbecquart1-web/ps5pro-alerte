name: Alerte PS5 Pro
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Envoyer une alerte de test
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier le stock
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test }}
          URL: https://direct.playstation.com/fr-fr/buy-consoles/playstation5-pro-console
        run: |
          if [ "$TEST" = "true" ]; then STATUS=TEST; else
            # Le JSON-LD de la page porte "availability":"https://schema.org/InStock|OutOfStock|..."
            STATUS=$(curl -sL --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36' "$URL" \
              | grep -o '"availability":"https://schema.org/[A-Za-z]*"' | head -1 | sed 's|.*schema.org/||; s|"||')
          fi
          echo "Statut : ${STATUS:-introuvable}"
          if [ -z "$STATUS" ]; then echo "::warning::statut introuvable (site bloque GitHub ou page modifiée)"; exit 0; fi
          if [ "$STATUS" != "OutOfStock" ]; then
            curl -sf -H "Title: PS5 Pro dispo !" -H "Priority: 5" -H "Tags: rotating_light" -H "Click: $URL" \
              -d "Statut : $STATUS - PlayStation Direct" "https://ntfy.sh/$TOPIC" > /dev/null
            echo "Alerte envoyée"
          fi
